name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libgmp-dev provides libgmp.so.10, which src/gmp_bridge.cpp resolves at
      # runtime with dlopen("libgmp.so.10", ...).  The binary still builds and
      # runs without it via the built-in BigFloat backend (MB_GMP=0).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev cmake

      # Build path 1: the plain Makefile.  AVX2 is on by default; AVX2=0 is
      # exercised separately below.
      - name: Build with GNU make (AVX2)
        run: make -j"$(nproc)"

      # The 1e38 pixel-for-pixel oracle comparison lives in tests/b2/cmp.cpp
      # (the same acceptance program b2.bat builds on Windows).  It is built
      # from the engine translation units with the entry point swapped, so it
      # links against exactly the same core as mset.
      - name: Build the 1e38 oracle comparison program
        run: |
          g++ -O3 -std=c++20 -mavx2 -mfma -pthread -Isrc \
            src/bigfloat.cpp \
            src/gmp_bridge.cpp \
            src/dive.cpp \
            src/reference.cpp \
            src/deep.cpp \
            src/render.cpp \
            src/palette.cpp \
            src/image.cpp \
            src/workspace.cpp \
            src/port/registry.cpp \
            tests/b2/cmp.cpp \
            -o build-linux/cmp -ldl -lpthread

      - name: Smoke test (mset info)
        run: ./build-linux/mset info

      # 1e38 perturbation vs exact BigFloat oracle.  A handful of
      # chaotic-boundary pixels can differ by +/-1 iteration, so this heavy
      # acceptance check is reported without failing the whole workflow.
      - name: 1e38 oracle comparison
        continue-on-error: true
        run: ./build-linux/cmp 38 3000 5

      # Build path 2: CMake, Release.
      - name: Build with CMake (Release)
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake -j"$(nproc)"

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          cp build-linux/mset artifacts/mset-make-avx2
          cp build-linux/cmp  artifacts/cmp
          cp build-cmake/mset artifacts/mset-cmake

      # Compatibility build: no AVX2 requirement.  make clean is needed so
      # make actually recompiles (the target is older than its sources).
      - name: Compatibility build (make AVX2=0)
        run: |
          make clean
          make AVX2=0 -j"$(nproc)"
          cp build-linux/mset artifacts/mset-portable
          ./artifacts/mset-portable info

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meter-mandelbrot-linux
          path: artifacts/
          if-no-files-found: error
